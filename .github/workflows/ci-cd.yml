name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP Syntax (Lint)
        run: |
          find . -name "*.php" ! -path "./vendor/*" ! -path "./Public/*" -print0 | xargs -0 -n 1 -P 4 php -l

  deploy:
    needs: lint-and-test
    # Chạy trực tiếp trên máy chủ Ubuntu (Self-hosted Runner)
    runs-on: self-hosted
    # Chỉ deploy tự động khi push (hoặc merge PR) vào nhánh main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Pull latest code
        run: |
          cd /home/vboxuser/cicd_docker
          git pull origin main

      - name: Deploy with Docker Compose
        run: |
          cd /home/vboxuser/cicd_docker
          # Up container (tự động nhận diện thay đổi cấu hình mà không cần compile lại)
          docker compose up -d

      - name: Verify deployment
        run: |
          sleep 2
          docker ps | grep web_qlsp_app && echo "✅ Container is running!" || echo "❌ Container not found!"

