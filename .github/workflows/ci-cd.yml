name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP Syntax (Lint)
        run: |
          find . -name "*.php" ! -path "./vendor/*" ! -path "./Public/*" -print0 | xargs -0 -n 1 -P 4 php -l

  build-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: web-qlsp:latest

  deploy:
    needs: build-docker
    # Chạy trực tiếp trên máy chủ Ubuntu (Self-hosted Runner)
    runs-on: self-hosted
    # Chỉ deploy khi push vào nhánh main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Pull latest code
        run: |
          cd $HOME/cicd_docker
          git pull origin main

      - name: Deploy with Docker Compose
        run: |
          cd $HOME/cicd_docker
          docker compose up -d --build
          docker image prune -f

      - name: Verify deployment
        run: |
          sleep 5
          docker ps | grep web_qlsp_app && echo "✅ Container is running!" || echo "❌ Container not found!"
